name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  EB_APP: ${{ secrets.EB_APPLICATION_NAME }}
  EB_ENV: ${{ secrets.EB_ENVIRONMENT_NAME }}
  EB_BUCKET: ${{ secrets.EB_S3_BUCKET }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: backend
        env:
          IMAGE_TAG: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          IMAGE_LATEST="${REGISTRY}/${ECR_REPOSITORY}:latest"

          docker build -t "$IMAGE_URI" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_URI"
          docker push "$IMAGE_LATEST"

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "VERSION_LABEL=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Package Dockerrun for Elastic Beanstalk
        run: |
          set -euo pipefail
          mkdir -p eb-package/.ebextensions
          python3 -c 'import json,os; open("eb-package/Dockerrun.aws.json","w",encoding="utf-8").write(json.dumps({"AWSEBDockerrunVersion":"1","Image":{"Name":os.environ["IMAGE_URI"],"Update":"true"},"Ports":[{"ContainerPort":8080,"HostPort":80}]}))'
          cp backend/.ebextensions/*.config eb-package/.ebextensions/ || true
          (cd eb-package && zip -r ../eb-deploy.zip .)

      - name: Deploy to Elastic Beanstalk
        run: |
          set -euo pipefail
          KEY="${EB_APP}/${VERSION_LABEL}.zip"

          aws s3 cp eb-deploy.zip "s3://${EB_BUCKET}/${KEY}"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP" \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=${EB_BUCKET},S3Key=${KEY}" \
            --process

          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENV" \
            --version-label "$VERSION_LABEL"

          echo "Waiting for environment Ready/Green..."
          for i in $(seq 1 60); do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENV" \
              --query "Environments[0].Status" --output text)
            HEALTH=$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENV" \
              --query "Environments[0].Health" --output text)
            VERSION=$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENV" \
              --query "Environments[0].VersionLabel" --output text)
            echo "Attempt $i: status=$STATUS health=$HEALTH version=$VERSION"
            if [ "$STATUS" = "Ready" ] && [ "$VERSION" = "$VERSION_LABEL" ] && { [ "$HEALTH" = "Green" ] || [ "$HEALTH" = "Yellow" ]; }; then
              echo "Deploy finished"
              exit 0
            fi
            if [ "$STATUS" = "Ready" ] && [ "$VERSION" != "$VERSION_LABEL" ]; then
              echo "Deploy failed; unexpected version $VERSION"
              aws elasticbeanstalk describe-events --environment-name "$EB_ENV" --max-items 10 --output table || true
              exit 1
            fi
            sleep 20
          done

          echo "Timed out"
          aws elasticbeanstalk describe-events --environment-name "$EB_ENV" --max-items 12 --output table || true
          exit 1
